<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chatbot Test Page</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f8fafc;
            color: #1e293b;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .card {
            background: #ffffff;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.06);
            max-width: 550px;
            width: 100%;
            text-align: center;
        }

        h1 {
            font-size: 1.8rem;
            margin-bottom: 12px;
            color: #0f172a;
        }

        p {
            font-size: 1rem;
            line-height: 1.6;
            color: #64748b;
            margin-bottom: 24px;
        }

        .status-badge {
            display: inline-block;
            background-color: #e0f2fe;
            color: #0369a1;
            font-size: 0.85rem;
            font-weight: 600;
            padding: 6px 14px;
            border-radius: 9999px;
        }
    </style>
</head>

<body>

    <div class="card">
        <h1>Welcome to My Website</h1>
        <p>
            This is a simple test page for integrating the chatbot widget.
            Look at the bottom corner of the screen to interact with the bot!
        </p>
        <span class="status-badge">Chatbot ID: 271cfa5a-927e-4b5c-905c-7aaf3564329e</span>
    </div>

    <!-- Chatbot Integration Script -->
    <script src="https://embedai-bot.vercel.app/widget.js" data-chatbot-id="271cfa5a-927e-4b5c-905c-7aaf3564329e" async>
    </script>

</body>

</html>
